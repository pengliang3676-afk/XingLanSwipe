name: Build XingLan Swipe

on:
  workflow_dispatch:
  push:
    branches: [main, native-vision-one-shot-test, codex/ui-accessibility-hid-short-test]
    paths:
      - "Tweak.xm"
      - "XingLanSwipeShared.h"
      - "XLBackIconDetector.h"
      - "XLBackIconDetector.m"
      - "ControlCenterModule/**"
      - "XLHIDSender.h"
      - "XLHIDSender.m"
      - "XingLanSwipe.plist"
      - "Makefile"
      - "control"
      - "control.roothide"
      - "RootHideDaemon.entitlements"
      - "RootHideDaemon.m"
      - "layout/**"
      - "layout.roothide/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        scheme: [roothide]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid make

      - name: Install RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos-roothide/sdks

      - name: Configure scheme
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos-roothide" >> "$GITHUB_ENV"
          echo "THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}" >> "$GITHUB_ENV"

      - name: Select clean package layout
        run: |
          rm -f ControlCenterModule/Resources/AutoGoWorker
          rm -rf layout/DEBIAN layout/Library/LaunchDaemons
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            cp control.roothide control
            cp -R layout.roothide/. layout/
            rm -rf layout/Library/LaunchDaemons
          else
            mkdir -p layout/DEBIAN
            printf '#!/bin/sh\nexit 0\n' > layout/DEBIAN/postinst
            printf '#!/bin/sh\nexit 0\n' > layout/DEBIAN/prerm
          fi
          chmod 0755 layout/DEBIAN/postinst layout/DEBIAN/prerm

      - name: Build package
        run: gmake clean package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: XingLanSwipe-${{ matrix.scheme }}
          path: packages/*.deb
