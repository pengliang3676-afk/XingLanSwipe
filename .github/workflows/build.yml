name: Build XingLan Swipe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Tweak.xm"
      - "XingLanSwipeShared.h"
      - "XLBackIconDetector.h"
      - "XLBackIconDetector.m"
      - "ControlCenterModule/**"
      - "XLHIDSender.h"
      - "XLHIDSender.m"
      - "XingLanSwipe.plist"
      - "Makefile"
      - "control"
      - "control.roothide"
      - "RootHideWorker.entitlements"
      - "layout/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        scheme: [roothide]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid make

      - name: Install RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos-roothide/sdks

      - name: Configure scheme
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos-roothide" >> "$GITHUB_ENV"
          echo "THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}" >> "$GITHUB_ENV"

      - name: Select RootHide package layout
        run: |
          cp control.roothide control
          rm -rf layout/DEBIAN layout/Library/LaunchDaemons

      - name: Sign RootHide AutoGo worker
        run: |
          test -f ControlCenterModule/Resources/AutoGoWorker
          ldid -M -SRootHideWorker.entitlements ControlCenterModule/Resources/AutoGoWorker
          ldid -e ControlCenterModule/Resources/AutoGoWorker > /tmp/xinglan-worker-entitlements.plist
          grep -q "platform-application" /tmp/xinglan-worker-entitlements.plist
          grep -q "com.apple.private.security.no-sandbox" /tmp/xinglan-worker-entitlements.plist

      - name: Build package
        run: gmake clean package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: XingLanSwipe-${{ matrix.scheme }}
          path: packages/*.deb
